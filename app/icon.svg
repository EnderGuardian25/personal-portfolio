<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Navy background matching #0B1F3A ink -->
  <rect width="100" height="100" rx="16" fill="#0B1F3A"/>
  <!-- Thin ivory rule across top — echoes the § section dividers -->
  <line x1="16" y1="22" x2="84" y2="22" stroke="#F6F6F1" stroke-width="1" opacity="0.35"/>
  <!-- DDC in ivory serif, tight tracked, matching Hero editorial weight -->
  <text
    x="50"
    y="63"
    text-anchor="middle"
    fill="#F6F6F1"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="30"
    font-weight="400"
    letter-spacing="-1"
  >DDC</text>
  <!-- Thin ivory rule across bottom -->
  <line x1="16" y1="76" x2="84" y2="76" stroke="#F6F6F1" stroke-width="1" opacity="0.35"/>
</svg>
